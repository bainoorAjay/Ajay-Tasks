<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    
  </head>
  <style>
    *{
        padding: 0px;
        margin: 0px;
    }
    body{
    min-height: 100vh;
        background-color: black;
        display: flex;
       justify-content: center;
        align-items:center;
      
    }
    label{
        font-size:20px;
    }
    
    .parent{
        height: 100%;
        border: 2px solid black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(orange,red);
       
    }
    .btn{
     display: flex;
     align-items: center;
     justify-content: center;
     gap: 10px;
    }
    input{
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 20%;
    }
    button{
        text-align: center;
        border: none;
        width: 50px;
        height: 50px;
        font-size: 30px;
        border-radius: 50%;
        background-color: lightblue;
    }
  </style>
  <body>
    <div class="parent">
      <label for="">Enter 1st Number:</label>

      <input type="number" id="num1" />
      
      <label for="">Enter 2nd Number:</label>

      <input type="number" id="num2" />
     
      <label for="">Result:</label>

      <input type="text" id="res" readonly />
      <br />
    <div class="btn">
          <button onclick="addValue()">+</button>
      <button onclick="subValue()">-</button>
      <button onclick="multiValue()">*</button>
      <button onclick="divValue()">%</button>

    </div>   

 </div>
    <script type="text/javascript" src="index.js"></script>
  </body>
</html>
