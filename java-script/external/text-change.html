<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
       function changeText(){
         document.getElementById("pa").innerText ="Welcome to chnage text"
       }
    </script>
</head>
<body>
    <h1>change-text</h1>
    <p id="pa">hello hi</p>
    <button onclick="changeText()">Change text</button>
</body>
</html>
