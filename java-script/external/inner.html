<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      function myText() {
        console.log("inner text", document.getElementById("pa").innerText);
        console.log("inner html", document.getElementById("pa").innerHTML);
      }
      function getData(){
        document.getElementById("pi").innerHTML="<h1>Welcome to js</h1>"
      }
    </script>
  </head>
  <body>
    <h1>innertext</h1>
    <p id="pa"><strong>hello</strong></p>
    <p id="pi">welcome to js</p>
    <button onclick="myText()">showinnertext</button>
    <button onclick="getData()">getData</button>
  </body>
</html>
