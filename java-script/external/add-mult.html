<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function addValue(){
    var num1= parseInt( document.getElementById("add").value)
      var num2 = parseInt(document.getElementById("multi").value);
      var sum = num1+num2
      document.getElementById("res").value=sum
        }
           function multiValue(){
    var num1= parseInt( document.getElementById("add").value)
      var num2 = parseInt(document.getElementById("multi").value);
      var sum = num1*num2
      document.getElementById("res").value=sum
        }
    </script>
</head>
<body>
    <div>
    <label for="">Enter a num1</label>
    <input type="text" placeholder="enter a number" id="add">
    <br>
    <br>
    <label for="">Enter a num1</label>
    <input type="text" placeholder="enter a number" id="multi">
    <br>
    <br>
    <label for="">Result:</label>
    <input type="text" name="" id="res" readonly>
    <br>
    <br>
    <button onclick="addValue()">ADD</button>
    <button onclick=" multiValue()">Multiplication</button>
    </div>
    <script  type="text/javascript" src="add-mult.js"></script>
</body>
</html>
