<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var a = 20;
      document.write(a, "<br/>");
      a += 10; //assgning the value using assign

      var b = 10;
      b += 1; //b=b+1
      document.write(b, "<br/>");

      var c = 10;
      c -= 2; //c=c-2
      document.write(c, "<br/>");

      var d = 10;
      d *= 4; //d=d*4
      document.write(d, "<br/>");

      var e = 10;
      e /= 1; //e=e/2
      document.write(e, "<br/>");

      var f = 10;
      f %= 2; //f=f%2
      document.write(f);
    </script>
  </body>
</html>
