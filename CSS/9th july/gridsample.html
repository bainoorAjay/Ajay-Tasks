<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 90vh;
          
            display: grid;
            grid-template-columns: repeat(4,1fr);
            /* grid-template-rows: repeat(3,2fr); */
            grid-template-rows: 25% 50% 25%;

        }
        .box{
            font-size: 20px;
          
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #child1{
            background-color: lightpink;
            grid-area: 1/1/2/5;
        }
        #child2{
            background-color: lightcoral;
            grid-area:2/1/3/2;
        }
        #child3{
            background-color: lightblue;
            grid-area: 3/2/2/4;
        }
        #child4{
            background-color: lightgreen;
        }
        #child5{
            background-color: lightpink;
            grid-area: 3/1/4/5;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box" id="child1">header</div>
        <div class="box" id="child2">left</div>
        <div class="box" id="child3">main</div>
        <div class="box" id="child4">right</div>
        <div class="box" id="child5">footer</div>
    </div>
    
</body>
</html>
