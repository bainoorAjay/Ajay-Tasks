<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            /* width: 1000px;
            height: 500px; */
            border: 1px solid black;
        display: grid;
      grid-template-columns: repeat(3,100px);
      grid-template-rows: repeat(3,100px);
        }
        .box{
           
           
            border: 1px solid black;
           
        }
        .child1{
            grid-area: 1/1/4/3;
            background-color: aqua;
        }
     
    </style>
</head>
<body>
    <div class="parent">
        <div class="box child1">hero1</div>
        <div class="box child2">hero2</div>
        <div class="box child3">hero3</div>
        <div class="box  child4">hero4</div>

      
    </div>
</body>
</html>
