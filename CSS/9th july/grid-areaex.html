<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            height: 40vh;
            width: 40vh;
            display: grid;
            /* border: 1px solid black; */
            /* grid-template-columns: repeat(2,1fr);
            grid-template-rows: repeat(2,1fr); */
            grid-template-areas: "A A A" "D E F";

        .box{
            border: 1px solid black;
            font-size: 20px;
          
        }
        #child1{
            background-color: red;
             grid-area: A;
        }
        /* #child2{
            background-color: green;
            grid-area: B;
        } */
        /* #child3{
            background-color: magenta;
            grid-area: C;
        } */
        #child4{
            background-color: brown;
            grid-area: D;
        }
           #child5{
            background-color: rgb(250, 230, 136);
             grid-area: E;
        }
        #child6{
            background-color: rgb(188, 241, 188);
            grid-area: F;
        }
        
    </style>
</head>
<body>
    <div class="parent">
        <div class="box" id="child1">A+</div>
        <!-- <div class="box" id="child2">B+</div> -->
        <!-- <div class="box" id="child3">C+</div> -->
        <div class="box" id="child4">D+</div>
        <div class="box" id="child5">E</div>
