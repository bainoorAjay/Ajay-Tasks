body{
     display: flex;
        align-items: center;
        justify-content: center;

}
     .box{
       
        background-color: red;
        height: 100px;
        width: 100px;
        border: 1px solid black;
        transition: all 6s linear;
        
     }
     .box:hover{
        text-align: center;
        transform: rotate(1turn);
        border-radius: 50%;
        transform:scale(3);
     }
     .box1{
        width: 100px;
        height: 100px;
        background-color: green;
         transition: all 5s linear;

     }
     .box1:hover{
        transform: scalex(2);

     .box2:hover{

     .box3{
        width: 100px;
        height: 100px;
        background-color: rgb(60, 238, 196);
        transition: all 5s linear;
     }
     .box3:hover{
        transform: scale(2);
     }
