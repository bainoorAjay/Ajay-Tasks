 .box{
    width: 1000px;
    height: 500px;
    border: 1px solid black;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
   
 }
 .box1{
    background-color: red;
    width: 200px;
    height: 200px;
    transition: all 3s linear;
 }
 #child1:hover{
   transform: rotateX(60deg);
 }
 #child2:hover{
    transform:rotateX(-60deg) ;
 }
 #child3:hover{
    transform:translateZ(50px);
 }
    </style>
  
</head>
<body>
    <div class="box">
       
    
    <div class="box1" id="child1">hero1</div>
    <div class="box1" id="child2">hero2</div>
    <div class="box1" id="child3">hero3</div>
    </div>
