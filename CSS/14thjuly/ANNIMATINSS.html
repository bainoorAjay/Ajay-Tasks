<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
           
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .parent{
            border: 1px solid black;
            height: 570px;
            width: 250px;
            display: flex;
            align-items: self-start;
            justify-content: center;
            animation-name: box-circle;
            animation-duration: 2s;

        }
        .box{
            background-color: red;
            border: 1px solid black;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation-name: box;
            animation-duration:2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;

          
            
        }
        @keyframes box {
            from{
             transform: translateY(0px) rotate(0deg);
            }
            to{
              transform: translateY(470px) rotate(150deg); 
            }
        }

    </style>
</head>
<body>
    <div class="parent">
       <div class="box">
        hello
    </div>
    </div>
   
</body>
</html>
