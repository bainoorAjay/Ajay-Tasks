<style>
    body {
    
   display: flex;
   flex-wrap: wrap;
}
.container {
    perspective: 1000px;
    display: flex;
    justify-content: center;
    align-items: center;
     width: 500px;
    height: 700px;
}
.card1 {
    position: relative;
    height: 50%;
    width: 50%;
    transform-style: preserve-3d;
    transition: 1s;
}
.front1,.back1 {
    position: absolute;
    height: 100%;
    width: 100%;
    backface-visibility: hidden;
}
.front1 {
    
    background-color: orangered;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    transform: rotateX(0deg);
}
.back1 {
    background-color: aquamarine;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    transform: rotateX(180deg);
}
.card1:hover {
    transform: rotateX(180deg);
}
