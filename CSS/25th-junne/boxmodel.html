<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV BAR</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            padding: 30px;
            margin: 10px;
            border: 2px solid rgb(235, 6, 6);
            border-radius: 10px;
            width: 98%;
            height: 150px;
        
            background-color:bLack;
          
            color:rgb(239, 231, 231);
         
            
        }
        a{
            text-decoration:none;
            color:black;
            padding: 10px;
            background-color: white;
            border: 1px solid rgb(160, 15, 15);
            border-radius: 10px;
        
        }
        p{
            width: 110px;
            border: 5px solid rgb(205, 38, 38);
            background-color: white;
            color: black;
            margin-bottom:40px;
            border-radius: 10px;
        }
        input[type="button"]{
            width:200px;
            height: 30px;
            margin-left: 300px;
            background-color: rgb(87, 0, 0);
            color: white;
            border: 1px solid rgb(255, 255, 255);
            border-radius: 5px;

            
        }
        input[type=text]{
            width: 200px;
            height: 30px;
            text-align: center;
            margin-left: 1px;
            background-color:white;
            color: black;
            border: 1px solid rgb(255, 255, 255);
            border-radius: 5px;
        }
        
    
    </style>
</head>
<body>
    <nav>
        <p>INNOMATICS</p>
        <a href="">HOME</a>
        <a href="">CONTACT</a>
        <a href="">ABOUT</a>
        <a href="">SERVICES</a>
        <a href="">LOGIN</a>
        <input type="button" value="login">
        <input type="text" placeholder="search">
    </nav>
</body>
</html>
