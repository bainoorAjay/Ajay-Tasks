<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 500px;
            width: 1000px;
            border: 1px solid;
            border-radius: 5px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3,1fr);
        }
        .box{
            border: 1px solid;
            margin: 10px;
        }
        #box1{
            grid-column: 1/3;
        }
        #box2{
            grid-column: 3/5;
        }
        #box3{

        }
        #box4{
            grid-column: 2/5;
        }
        #box5{
            grid-column: 1/5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"></div>
    </div>
</body>
</html>
